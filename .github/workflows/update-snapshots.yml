# Publishes the latest self-tested snapshots from every source language, so
# that main always holds the newest snapshot set. This workflow is not a
# required check.

name: Update snapshots

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Update snapshots from every source
    if: github.repository == 'apache/datasketches-tck'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: Update snapshots
        id: update
        shell: bash
        run: mise run tck -- snapshots update --skip-unstable-only 2>&1 | tee "$RUNNER_TEMP/snapshot-update.log"

      - name: Summarize update
        if: always() && steps.update.outcome != 'skipped'
        run: |
          {
            echo '## Snapshot update'
            echo
            echo '```'
            grep -E '^(Update |Summary:|Source revision:|✓|✗|Warning:|Error:)' "$RUNNER_TEMP/snapshot-update.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated snapshots
        run: |
          if [[ -z "$(git status --porcelain -- config.toml serialization_test_data)" ]]; then
            echo "Snapshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config.toml serialization_test_data
          {
            echo "chore: update snapshots to the latest upstream revisions"
            echo
            grep -E '^(Update |Summary:|Source revision:)' "$RUNNER_TEMP/snapshot-update.log" || true
          } > "$RUNNER_TEMP/snapshot-commit-message.txt"
          git commit --quiet --file "$RUNNER_TEMP/snapshot-commit-message.txt"
          git push origin HEAD:${{ github.ref_name }}
